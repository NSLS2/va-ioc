# Stream Device Protocol for the Varian Dual Ion Pump controller

# $1 = channel number: 1, 2
# $2 = setpoint:       RLY, PRO or CTL

locktimeout = 5000;
replytimeout = 1000;
readtimeout  = 100;
writetimeout = 200;

# Logic type, 1 byte
readLogicCmd   
{
        out "\x02\x80\$1\x30\x03%01<xor>";
        in  "\x02\x80\$1\x30%{0|1}\x03%01<xor>";
}

writeLogicCmd
{
        out "\x02\x80\$1\x31%{0|1}\x03%01<xor>";
        in  "\x02\x80\x06\x03%01<xor>";
}

# Numeric type, 6 bytes
readNumCmd
{
	out "\x02\x80\$1\x30\x03%01<xor>";
	in  "\x02\x80\$1\x30%06d\x03%01<xor>";
}

writeNumCmd
{
	out "\x02\x80\$1\x31%06d\x03%01<xor>";
	in  "\x02\x80\x06\x03%01<xor>";
}

# Alphanumeric type, 10 bytes
readAlphaCharCmd
{
	out "\x02\x80\$1\x30\x03%01<xor>";
	in  "\x02\x80\$1\x30%10c\x03%01<xor>";
}

readAlphaBinCmd
{
        out "\x02\x80\$1\x30\x03%01<xor>";
        in  "\x02\x80\$1\x30%10b\x03%01<xor>";
}

writeAlphaBinCmd
{
        out "\x02\x80\$1\x31%010b\x03%01<xor>";
        in  "\x02\x80\x06\x03%01<xor>";
}

readAlphaExpCmd
{
        out "\x02\x80\$1\x30\x03%01<xor>";
        in  "\x02\x80\$1\x30%10E\x03%01<xor>";
}

writeAlphaExpCmd
{
        out "\x02\x80\$1\x31\x20\x20\x20%7.1E\x03%01<xor>";
        in  "\x02\x80\x06\x03%01<xor>";
}


